# Локальная база PostgreSQL для разработки: docker compose up -d
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: boosty
    ports:
      - "5432:5432"
    volumes:
      - boosty_db:/var/lib/postgresql/data
volumes:
  boosty_db:
